<!doctype html>
<!-- A small fake product page with the traps the drivers exist for:
     a loading skeleton, an invisible empty state that stays in the DOM, a tooltip
     that only opens on a real mouse hover, a plan gate, a wrong-id error page,
     and evidence far below the fold.
     States by query string: ?plan=free|pro, ?id=missing. -->
<html><head><meta charset="utf-8"><title>Demo app</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;margin:24px;color:#1d1d1f}
  table{border-collapse:collapse;width:640px}td,th{border-bottom:1px solid #ddd;padding:6px 10px;text-align:left}
  .skel td{background:#eee;color:transparent}
  .empty{opacity:0}                         /* hidden, still in the DOM and in innerText */
  .info{display:inline-block;margin-left:8px;cursor:help;border:1px solid #888;border-radius:50%;width:18px;text-align:center}
  .tip{display:none;position:absolute;background:#1d1d1f;color:#fff;padding:4px 8px;border-radius:4px;margin:4px 0 0 -40px}
  .info:hover .tip{display:block}           /* real hover only: a synthetic event never sets :hover */
  .far{margin-top:2400px}
</style></head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const plan = q.get('plan') || 'free';
const root = document.getElementById('root');
if (q.get('id') === 'missing') {
  root.innerHTML = '<h1>Something went wrong</h1><p>Unable to load project. It may belong to another account.</p>';
} else {
  const rows = [['Atlas','Service','Critical'],['Borealis','Library','High'],['Cirrus','Service','Low'],['Dune','Job','Low'],['Eon','Library','Medium']];
  const table = body => `<table><thead><tr><th>Name</th><th>Type</th><th>Risk</th></tr></thead><tbody>${body}</tbody></table>`;
  root.innerHTML = `<h1>Projects</h1><p>Loading projects...</p>${table('<tr class="skel"><td>x</td><td>x</td><td>x</td></tr>'.repeat(3))}`;
  setTimeout(() => {
    root.innerHTML = `<h1>Projects</h1>
      <div role="tablist"><span role="tab" aria-selected="true">All ${rows.length}</span></div>
      <p>Risk summary <span class="info" id="risk-info">i<span class="tip" role="tooltip">Risk is the highest severity open finding</span></span></p>
      ${plan === 'pro' ? '<button>Export CSV</button>' : '<button>Upgrade to export</button>'}
      ${table(rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join(''))}
      <p class="empty">No projects found</p>
      <p class="far" id="audit">Audit log: 3 entries</p>`;
  }, 1500);
}
</script>
</body></html>
